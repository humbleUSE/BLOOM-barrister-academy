<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Inspo Pattern</title>
        <link href="/src/css/global.css" rel="stylesheet" />
    </head>
    <body>
        <div class="inspo region indent">
            <!-- Corner ---------------------------------------------------- -->
            <div
                class="corner"
                data-corner-docked
                data-corner-theme="primary"
            ></div>
            <div class="wrapper">
                <h2 class="visually-hidden">Master the craft</h2>
                <div class="inspo__grid">
                    <p arial-hidden="true" class="inspo__heading">Master</p>
                    <p aria-hidden="true" class="inspo__heading">the craft.</p>
                    <div class="inspo__img">
                        <img
                            alt="Overhead shot of someone pouring frothed milk into a latté cup."
                            loading="lazy"
                            src="/src/images/inspo.jpg"
                        />
                    </div>
                </div>
            </div>
            <div class="inspo__stripe indent"></div>
        </div>
    </body>
</html>
