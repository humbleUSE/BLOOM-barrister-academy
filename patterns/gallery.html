<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Gallery Pattern</title>
        <link href="/src/css/global.css" rel="stylesheet" />
    </head>
    <body class="p-10">
        <article class="gallery grid">
            <div class="flow">
                <p class="gallery__byline">the two go hand in hand</p>
                <img
                    alt="An over head shot of someone handing a latte to another person"
                    loading="lazy"
                    src="/src/images/gallery-1.jpg"
                />
            </div>
            <div class="flow">
                <img
                    alt="Three people holding their coffees up as they are about to “cheers"
                    loading="lazy"
                    src="/src/images/gallery-2.jpg"
                />
            </div>
            <div class="flow">
                <p >
                    Our London HQ is home to a community of passionate coffee
                    lovers and baristas
                </p>
                <img
                    alt="A friendly looking Barista looking straight at the camera with a coffee shop kitchen in the background"
                    loading="lazy"
                    src="/src/images/gallery-3.jpg"
                />
            </div>
            <div class="flow">
                <img
                    alt="Ambient shot of a coffee shop"
                    loading="lazy"
                    src="/src/images/gallery-4.jpg"
                />
                <a class="button" data-button-variant="secondary" href="/#">
                    <span>About us</span>
                    <svg
                        aria-hidden="true"
                        fill="none"
                        focusable="false"
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M16.172 13H4v-2h12.172l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13Z"
                            fill="currentColor"
                        ></path>
                    </svg>
                    <span
                        aria-hidden="true"
                        class="corner"
                        data-corner-docked
                    ></span>
                </a>
            </div>
        </article>
    </body>
</html>
