<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Card Pattern</title>
        <link href="/src/css/global.css" rel="stylesheet" />
    </head>
    <body>
        <div class="grid grid-cols-2 p-4">
            <article class="card">
                <a href="#1">
                    <img
                        alt="An over-head shot of someone making a latte with frothed milk from a jug"
                        src="../src/images/card-image.jpg"
                    />
                </a>
                <div class="card__content flow">
                    <h4 class="card__heading">Barista essentials</h4>
                    <p class="card__meta">Sep 29. London, UK.</p>
                    <a class="button" href="#1">
                        <span>Find out more</span>
                        <svg
                            aria-hidden="true"
                            fill="none"
                            focusable="false"
                            viewBox="0 0 24 24"
                            xmlns="<http://www.w3.org/2000/svg>"
                        >
                            <path
                                d="M16.172 13H4v-2h12.172l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13Z"
                                fill="currentColor"
                            ></path>
                        </svg>
                        <span
                            aria-hidden="true"
                            class="corner"
                            data-corner-docked
                        ></span>
                    </a>
                </div>
            </article>
            <article class="card">
                <a href="#1">
                    <img
                        alt="An over-head shot of someone making a latte with frothed milk from a jug"
                        src="../src/images/card-image.jpg"
                    />
                </a>
                <div class="card__content flow">
                    <h3 class="card__heading">barister essentials</h3>
                    <p class="card__meta">Sep 29, London, UK.</p>
                    <p class="card__alert"><span>Last few spots</span></p>
                    <a class="button" href="#1">
                        <span>Find out more</span>
                        <svg
                            aria-hidden="true"
                            fill="none"
                            focusable="false"
                            viewBox="0 0 24 24"
                            xmlns="<http://www.w3.org/2000/svg>"
                        >
                            <path
                                d="M16.172 13H4v-2h12.172l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13Z"
                                fill="currentColor"
                            ></path>
                        </svg>
                        <span
                            aria-hidden="true"
                            class="corner"
                            data-corner-docked
                        ></span>
                    </a>
                </div>
            </article>
        </div>
    </body>
</html>
