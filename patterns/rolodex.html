<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Rolodex Pattern</title>
        <link href="/src/css/global.css" rel="stylesheet" />
    </head>
    <body class="wrapper">
        <div class="rolodex">
            <ol class="rolodex__list flow" role="list">
                <li>
                    <a
                        class="rolodex__item sidebar"
                        data-reversed
                        data-rolodex-theme="light"
                        href="/#"
                    >
                        <h3 class="rolodex__heading">
                            <span class="rolodex__number">*07</span>
                            <span
                                >A step-by-step guide to brewing with
                                Chemex</span
                            >
                        </h3>
                        <img
                            alt="Ground coffee being poured into a Chemex from a height"
                            src="/src/images/rolodex-1.jpg"
                        />
                    </a>
                </li>
                <li>
                    <a
                        class="rolodex__item sidebar"
                        data-reversed
                        data-rolodex-theme="primary"
                        href="/#"
                    >
                        <h3 class="rolodex__heading">
                            <span class="rolodex__number">*06</span>
                            <span>The science of coffee extraction</span>
                        </h3>
                        <img
                            alt="Under-shot of an espresso machine, pouring espresso"
                            src="/src/images/rolodex-2.jpg"
                        />
                    </a>
                </li>
                <li>
                    <a
                        class="rolodex__item sidebar"
                        data-reversed
                        data-rolodex-theme="dark"
                        href="/#"
                    >
                        <h3 class="rolodex__heading">
                            <span class="rolodex__number">*05</span>
                            <span
                                >A guid to achieving next-level lette art</span
                            >
                        </h3>
                        <img alt="" src="/src/images/rolodex-3.jpg"
                    /></a>
                </li>
            </ol>
        </div>
    </body>
</html>
