<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Hero pattern</title>
        <link href="../src/css/global.css" rel="stylesheet" />
    </head>
    <body class="p-4">
        <div class="grid grid-cols-1  place-items-center">
            <div class="hero">
                <img
                    alt="A female barrista with a hat and glasses smiles while making coffee"
                    draggable="false"
                    src="../src/images/hero.jpg"
                />
                <a class="hero__skip-link flow" href="#content">
                    <span class="hero__skip-link-icon">
                        <svg
                            aria-hidden="true"
                            fill="none"
                            focusable="false"
                            viewBox="0 0 24 24"
                            xmlns="<http://www.w3.org/2000/svg>"
                        >
                            <path
                                d="M11 16.172V4h2v12.172l5.364-5.364 1.414 1.414L12 20l-7.778-7.778 1.414-1.414L11 16.172Z"
                                fill="currentColor"
                            ></path>
                        </svg>
                    </span>
                    <span class="hero__skip-link-label"
                        >Discover our courses</span
                    >
                </a>
            </div>
        </div>
    </body>
</html>
