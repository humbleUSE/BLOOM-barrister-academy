<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Nav Pattern</title>
        <link href="../src/css/global.css" rel="stylesheet" />
    </head>
    <body>
        <div class="nav-bars grid grid-cols-1 grid-rows-2 place-items-center">
            <nav aria-label="primary" class="nav">
                <ul class="cluster" role="list">
                    <li><a aria-current="page" href="/courses">Courses</a></li>
                    <li><a href="/about">About</a></li>
                    <li><a href="/Contact">Contact</a></li>
                </ul>
            </nav>
            <nav aria-label="secondary" class="nav">
                <ul class="flow" >
                    <li><a aria-current="page" href="/courses">Courses</a></li>
                    <li><a href="/about">About</a></li>
                    <li><a href="/Contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </body>
</html>
