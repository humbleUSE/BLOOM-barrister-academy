<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Button Pattern</title>
        <link href="../src/css/global.css" rel="stylesheet" />
    </head>
    <body>
        <div
            class="grid grid-cols-2 justify-items-center items-center h-screen"
        >
            <button class="button" type="button">
                <span>Find out more</span>
                <svg
                    aria-hidden="true"
                    fill="none"
                    focusable="false"
                    viewBox="0 0 24 24"
                    xmlns="<http://www.w3.org/2000/svg>"
                >
                    <path
                        d="M16.172 13H4v-2h12.172l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13Z"
                        fill="currentColor"
                    ></path>
                </svg>
                <span
                    aria-hidden="true"
                    class="corner"
                    data-corner-docked
                ></span>
            </button>
            <button
                class="button"
                data-button-variant="secondary"
                type="button"
            >
                <span>Find out more</span>
                <svg
                    aria-hidden="true"
                    fill="none"
                    focusable="false"
                    viewBox="0 0 24 24"
                    xmlns="<http://www.w3.org/2000/svg>"
                >
                    <path
                        d="M16.172 13H4v-2h12.172l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13Z"
                        fill="currentColor"
                    ></path>
                </svg>
                <span
                    aria-hidden="true"
                    class="corner"
                    data-corner-docked
                ></span>
            </button>
        </div>
    </body>
</html>
